name: Build Roothide1.0

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Theos
        run: |
          set -e
          sudo apt-get update
          sudo apt-get install -y build-essential fakeroot git perl clang unzip curl wget libz-dev
          git clone --recursive https://github.com/theos/theos.git $HOME/theos
          echo "THEOS=$HOME/theos" >> $GITHUB_ENV
          echo "$HOME/theos/bin" >> $GITHUB_PATH
          mkdir -p $HOME/theos/sdks
          # Try to get iOS SDK
          curl -L https://github.com/theos/sdks/archive/master.tar.gz -o sdks.tar.gz
          tar -xzf sdks.tar.gz
          cp -v sdks-master/*.sdk $HOME/theos/sdks/ 2>/dev/null || true
          rm -rf sdks.tar.gz sdks-master

      - name: Build package
        run: |
          set -e
          export THEOS=$HOME/theos
          export PATH=$THEOS/bin:$PATH
          make clean || true
          make package FINALPACKAGE=1

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: Roothide1.0-deb
          path: packages/*.deb
          if-no-files-found: error
